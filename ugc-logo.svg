      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(225 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(240 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(255 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(270 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(285 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(300 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(315 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(330 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(345 100 80)" />
    </g>

    <!-- Top V of Book (Thicker and sharper) -->
    <path d="M 64 140 L 100 152 L 136 140 L 126 148 L 100 156 L 74 148 Z" />

    <!-- Bottom V of Book (Thick bold shape) -->
