<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g fill="#FF6600">
    <!-- Wheel Outer Ring (Thick) -->
    <circle cx="100" cy="80" r="52" stroke="#FF6600" stroke-width="6" fill="none" />
    <circle cx="100" cy="80" r="45" stroke="#FF6600" stroke-width="2" fill="none" />
    
    <!-- Wheel Center -->
    <circle cx="100" cy="80" r="12" fill="#FF6600" />
    <circle cx="100" cy="80" r="6" fill="white" />

    <!-- Thick Spokes -->
    <g id="spokes">
      <!-- We will create 24 triangular spokes -->
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(15 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(30 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(45 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(60 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(75 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(90 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(105 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(120 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(135 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(150 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(165 100 80)" />
      <path d="M 98 70 L 102 70 L 105 38 L 95 38 Z" transform="rotate(180 100 80)" />
