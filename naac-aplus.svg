<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(100, 95)">
    <!-- Gold Sunburst -->
    <path fill="#facc15" d="M0 -80 
      L10 -68 L24 -75 L28 -60 L43 -61 L41 -46 L55 -41 L47 -28 L60 -18 
      L49 -8 L60 5 L47 12 L55 26 L41 31 L43 46 L28 45 L24 60 L10 53 
      L0 65 
      L-10 53 L-24 60 L-28 45 L-43 46 L-41 31 L-55 26 L-47 12 L-60 5 
      L-49 -8 L-60 -18 L-47 -28 L-55 -41 L-41 -46 L-43 -61 L-28 -60 L-24 -75 
      L-10 -68 Z" />
    
    <!-- Outer Orange border -->
    <circle r="60" fill="#f97316" />
    
    <!-- Thin inner gold line -->
    <circle r="52" fill="#fbbf24" />
    
    <!-- Dark Red inner circle -->
    <circle r="48" fill="#991b1b" />

    <!-- A+ Text -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-weight="900" font-size="45" fill="white" text-anchor="middle">A+</text>
    
    <!-- Circular Text: ACCREDITED WITH GRADE -->
    <path id="curve" d="M -43 10 A 44 44 0 1 1 43 10" fill="transparent" />
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white" letter-spacing="1">
      <textPath href="#curve" startOffset="50%" text-anchor="middle">
        ACCREDITED WITH GRADE
      </textPath>
    </text>

    <!-- Bottom Ribbon (Red) -->
    <path d="M-60 50 L60 50 L60 80 L-60 80 Z" fill="#ef4444" />
    <!-- Ribbon tails -->
    <path d="M-60 50 L-80 65 L-60 80 Z" fill="#dc2626" />
    <path d="M60 50 L80 65 L60 80 Z" fill="#dc2626" />
    
    <text x="0" y="72" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="white" text-anchor="middle">NAAC</text>
  </g>
</svg>
